events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/error.log warn;
    limit_req_zone $binary_remote_addr zone=enrollment:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/pcmed/tls.crt;
        ssl_certificate_key /etc/pcmed/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 1m;
        client_body_timeout 20s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        root /usr/share/nginx/html;
        location = /api/agent/enroll {
            limit_req zone=enrollment burst=10 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
        }
        location /api/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
        }
        location ~ ^/(realms|resources|admin)/ {
            proxy_pass http://keycloak:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_buffer_size 32k;
            proxy_buffers 8 32k;
        }
        location = /config.json {
            add_header Cache-Control no-store;
        }
        location /packages/ {
            alias /srv/pcmed-packages/;
            autoindex off;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "private, max-age=3600";
        }
        location / {
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
