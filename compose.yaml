name: pcmed
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pcmed
      POSTGRES_USER: pcmed
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run scripts/configure.py}
    volumes: ["database:/var/lib/postgresql/data"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcmed -d pcmed"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  identity-database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${IDENTITY_DATABASE_PASSWORD:?Run scripts/configure.py}
    volumes: ["identity-database:/var/lib/postgresql/data"]
    networks: [identity]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identity-database:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${IDENTITY_DATABASE_PASSWORD}
      KC_HOSTNAME: https://${PCMED_HOSTNAME:?Run scripts/configure.py}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run scripts/configure.py}
      KC_HEALTH_ENABLED: "true"
    volumes: ["./secrets/realm.json:/opt/keycloak/data/import/pcmed-realm.json:ro"]
    depends_on:
      identity-database: { condition: service_healthy }
    networks: [identity, backend]
    restart: unless-stopped
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      PCMED_DATABASE_URL: postgresql+psycopg://pcmed:${DATABASE_PASSWORD}@database/pcmed
    depends_on:
      database: { condition: service_healthy }
    networks: [backend]
  api:
    build: ./backend
    environment:
      PCMED_DATABASE_URL: postgresql+psycopg://pcmed:${DATABASE_PASSWORD}@database/pcmed
      PCMED_OIDC_ISSUER: https://${PCMED_HOSTNAME}/realms/pcmed
      PCMED_OIDC_JWKS_URL: http://keycloak:8080/realms/pcmed/protocol/openid-connect/certs
      PCMED_ARTIFACT_HOSTS: ${ARTIFACT_HOSTS}
    depends_on:
      migrate: { condition: service_completed_successfully }
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["${VPN_BIND_ADDRESS:?Run scripts/configure.py}:443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./secrets/tls.crt:/etc/pcmed/tls.crt:ro
      - ./secrets/tls.key:/etc/pcmed/tls.key:ro
      - ./secrets/frontend-config.json:/usr/share/nginx/html/config.json:ro
      - ./secrets/packages:/srv/pcmed-packages:ro
    depends_on:
      api: { condition: service_healthy }
      keycloak: { condition: service_started }
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes:
  database:
  identity-database:
networks:
  backend: { internal: true }
  identity: { internal: true }
