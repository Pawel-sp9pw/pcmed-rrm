[project]
name = "pcmed-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.12,<1",
  "uvicorn>=0.34.2,<1",
  "SQLAlchemy>=2.0.40,<2.1",
  "psycopg[binary]>=3.2.6,<4",
  "PyJWT[crypto]>=2.15.0,<3",
  "pydantic-settings>=2.9.1,<3",
  "alembic>=1.15.2,<2",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10", "httpx>=0.28.1,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
